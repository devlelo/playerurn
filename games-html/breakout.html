<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playerun Breakout</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,850px);text-align:center}h1{color:#d5ff45;letter-spacing:4px}canvas{width:100%;background:#111923;border:2px solid #d5ff45;border-radius:12px;touch-action:none}p{color:#aab4c4}</style><main><h1>BREAKOUT</h1><canvas id="c" width="800" height="500"></canvas><p>Setas / A-D ou arrasta o dedo para mover a barra · Clica para começar</p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let px=350,bx=400,by=420,vx=4,vy=-4,run=false,bricks=[],score=0;function init(){bricks=[];for(let r=0;r<5;r++)for(let k=0;k<10;k++)bricks.push({x:30+k*74,y:35+r*27,on:1});score=0;bx=400;by=420;vx=4;vy=-4;run=false}onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')px-=35;if(e.key==='ArrowRight'||e.key==='d')px+=35};c.onpointermove=e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)*800/r.width-55};c.onclick=()=>run=true;function frame(){x.fillStyle='#111923';x.fillRect(0,0,800,500);px=Math.max(0,Math.min(690,px));x.fillStyle='#d5ff45';bricks.forEach(b=>{if(b.on){x.fillRect(b.x,b.y,64,17)}});x.fillRect(px,455,110,12);x.beginPath();x.arc(bx,by,9,0,7);x.fillStyle='#fff';x.fill();x.fillStyle='#fff';x.font='20px system-ui';x.fillText('PONTOS '+score,20,490);if(run){bx+=vx;by+=vy;if(bx<9||bx>791)vx*=-1;if(by<9)vy*=-1;if(by>445&&bx>px&&bx<px+110){vy=-Math.abs(vy);vx+=(bx-(px+55))*.06}bricks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+64&&by>b.y&&by<b.y+17){b.on=0;vy*=-1;score+=10}});if(by>510||bricks.every(b=>!b.on))init()}requestAnimationFrame(frame)}init();frame();</script></main></html>
