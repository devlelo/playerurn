<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playerun Snake</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(94vw,620px)}h1{color:#d5ff45;letter-spacing:4px}canvas{width:100%;background:#111923;border:2px solid #d5ff45;border-radius:12px;touch-action:pan-y}p{color:#aab4c4}button{background:#d5ff45;border:0;padding:12px 20px;border-radius:8px;font-weight:bold}</style><main><h1>SNAKE ARENA</h1><h2 id="score">0</h2><canvas id="c" width="600" height="600"></canvas><p>Setas / WASD · No telemóvel usa os botões</p><div><button onclick="dir(0,-1)">↑</button><br><button onclick="dir(-1,0)">←</button> <button onclick="dir(0,1)">↓</button> <button onclick="dir(1,0)">→</button></div><p><button onclick="start()">RECOMEÇAR</button></p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),N=20,S=30;let snake,food,d,score,timer;function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:15,y:10};d={x:1,y:0};score=0;document.querySelector('#score').textContent=score;clearInterval(timer);timer=setInterval(tick,115);draw()}function dir(a,b){if(a!==-d.x||b!==-d.y)d={x:a,y:b}}onkeydown=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m)dir(...m)};function tick(){let h={x:snake[0].x+d.x,y:snake[0].y+d.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector('#score').textContent=score;food={x:Math.random()*N|0,y:Math.random()*N|0}}else snake.pop();draw()}function draw(){x.fillStyle='#111923';x.fillRect(0,0,600,600);x.fillStyle='#d5ff45';snake.forEach(p=>x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4));x.fillStyle='#ff624d';x.beginPath();x.arc(food.x*S+15,food.y*S+15,12,0,7);x.fill()}start();</script></main></html>
