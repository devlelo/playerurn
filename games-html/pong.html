<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playerun Pong</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,900px);text-align:center}h1{color:#d5ff45;letter-spacing:4px}canvas{width:100%;background:#101722;border:2px solid #d5ff45;border-radius:12px;touch-action:none}p{color:#aab4c4}</style><main><h1>PONG</h1><canvas id="c" width="800" height="450"></canvas><p>W / S ou ↑ / ↓ para mover · Toque e arraste no ecrã · Primeiro a 7 vence</p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let py=180,by=180,bx=400,vx=5,vy=3,score=[0,0],keys={};onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointermove=e=>{let r=c.getBoundingClientRect();py=(e.clientY-r.top)*450/r.height-45};function reset(){bx=400;by=225;vx=(Math.random()>.5?1:-1)*5;vy=(Math.random()-.5)*6}function frame(){x.clearRect(0,0,800,450);x.fillStyle='#d5ff45';for(let y=0;y<450;y+=24)x.fillRect(397,y,6,12);if(keys.w||keys.arrowup)py-=7;if(keys.s||keys.arrowdown)py+=7;py=Math.max(0,Math.min(360,py));by+=vy;bx+=vx;if(by<10||by>440)vy*=-1;let by2=Math.max(0,Math.min(360,by-45));if(bx<32&&by>py&&by<py+90){vx=Math.abs(vx)*1.06;vy+=(by-(py+45))*.08}if(bx>768&&by>by2&&by<by2+90){vx=-Math.abs(vx)*1.06;vy+=(by-(by2+45))*.08}if(bx<0){score[1]++;reset()}if(bx>800){score[0]++;reset()}x.fillStyle='#fff';x.fillRect(18,py,14,90);x.fillRect(768,by2,14,90);x.beginPath();x.arc(bx,by,10,0,7);x.fill();x.font='bold 42px system-ui';x.fillText(score[0],330,55);x.fillText(score[1],445,55);if(Math.max(...score)<7)requestAnimationFrame(frame);else{x.font='bold 32px system-ui';x.fillStyle='#d5ff45';x.fillText('FIM DE JOGO · TOCA PARA RECOMEÇAR',150,250)}}c.onclick=()=>{if(Math.max(...score)>=7){score=[0,0];py=180;reset();frame()}};frame();</script></main></html>
